<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-In</title>
    <link rel="stylesheet" href="styles/signup.css">
    <link rel="stylesheet" href="styles/index.css">
</head>

<body>
    <div class="form-cont">
        <div class="heading">
           <h1>Did You Exist ?</h1> 
        </div>
        <form id="signup" action="/signup" class="signup">

            <input name="email" type="text" placeholder="Enter  email" required>
            <input name="password" type="password" placeholder="Enter password" required>

            <button id="signup-btn">Login</button>
        </form>
    </div>
</body>

<script>
    const form = document.getElementById('signup');
    const signup_btn = document.getElementById('signup-btn');

    async function signin(event) {
        event.preventDefault();

        const formdata = new FormData(form);
        // js object
        const login = {
           
            email: formdata.get('email'),
            password: formdata.get('password'),
           
        }

        const response = await fetch('https://authentication-project-tflu.onrender.com/signin', {
            method: 'POST',
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(login)
        });

        // console.log(typeof request.body) ;

        // response  from backend 
        const data = await response.json();
        alert(data.message);

        // relocating to homepage becoz fetch api is doesnt automatically navigate to new page
        window.location.href = `https://authentication-project-tflu.onrender.com${data.redirect}`;
    }

    form.addEventListener('submit', signin);

            
        
</script>

</html>
